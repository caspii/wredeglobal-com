    </clipPath>
    <clipPath id="fav-dx"><rect x="0" y="0" width="100" height="238"/></clipPath>
    <clipPath id="fav-sn"><rect x="100" y="0" width="100" height="238"/></clipPath>
  </defs>
  <g clip-path="url(#fav-field)">
    <rect x="0" y="0" width="100" height="238" fill="#d9271b"/>
    <rect x="100" y="0" width="100" height="238" fill="#f9c301"/>
    <circle cx="100" cy="113" r="49" fill="none" stroke="#f9c301" stroke-width="27" clip-path="url(#fav-dx)"/>
    <circle cx="100" cy="113" r="49" fill="none" stroke="#d9271b" stroke-width="27" clip-path="url(#fav-sn)"/>
  </g>
