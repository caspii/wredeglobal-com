<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 238" width="200" height="238" role="img" aria-labelledby="fav-t">
  <title id="fav-t">Wrede arms, reduced: per pale gules and or, an annulet counterchanged</title>
  <!-- The wreath boiled down to a plain ring. Five roses cannot resolve at
       16 pixels; a counterchanged annulet still reads as the same mark. -->
