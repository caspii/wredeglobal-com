<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="icon-t">
  <title id="icon-t">Wrede arms on a solid tile, for app icons</title>
  <!-- Square, full-bleed, no transparency. iOS composites apple-touch-icon
       onto black, so the tile carries its own background. The shield is the
       200x238 drawing scaled to leave an even margin. -->
  <defs>
    <clipPath id="icon-field">
      <path d="M10 10H190V128C190 172 158 206 100 229C42 206 10 172 10 128Z"/>
    </clipPath>
    <clipPath id="icon-dx"><rect x="0" y="0" width="100" height="238"/></clipPath>
    <clipPath id="icon-sn"><rect x="100" y="0" width="100" height="238"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#14130f"/>
  <g transform="translate(100.73,70.48) scale(1.5525)">
    <g clip-path="url(#icon-field)">
      <rect x="0" y="0" width="100" height="238" fill="#d9271b"/>
      <rect x="100" y="0" width="100" height="238" fill="#f9c301"/>
      <circle cx="100" cy="113" r="49" fill="none" stroke="#f9c301" stroke-width="27" clip-path="url(#icon-dx)"/>
      <circle cx="100" cy="113" r="49" fill="none" stroke="#d9271b" stroke-width="27" clip-path="url(#icon-sn)"/>
    </g>
  </g>
</svg>
