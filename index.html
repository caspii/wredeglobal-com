<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ==== EDIT THESE ==== -->
<title>Wrede Global</title>
<meta name="description" content="Wrede Global — independent software and product ventures.">
<!-- ==================== -->

<link rel="canonical" href="https://wredeglobal.com/">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:url" content="https://wredeglobal.com/">
<meta property="og:title" content="Wrede Global">
<meta property="og:description" content="Wrede Global — independent software and product ventures.">
<meta name="twitter:card" content="summary">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
  :root {
    --ink:       #16150f;
    --ink-soft:  #5c584b;
    --paper:     #faf8f3;
    --rule:      #e2ddd0;
    --accent:    #9a4b1e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink:      #f2efe6;
      --ink-soft: #a29d90;
      --paper:    #14130f;
      --rule:     #302d25;
      --accent:   #d9a15e;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 2rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-serif, Iowan Old Style, Palatino, "Palatino Linotype", Georgia, serif;
    font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 34rem;
    margin: 0 auto;
    align-self: center;
    padding: 3rem 0;
  }

  .eyebrow {
    margin: 0 0 2.5rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  h1 {
    margin: 0;
    font-size: clamp(2.5rem, 1.7rem + 3.6vw, 4rem);
    font-weight: 500;
    line-height: 1.02;
    letter-spacing: -0.022em;
    text-wrap: balance;
  }

  h1 .of {
    display: block;
    color: var(--accent);
  }

  .lede {
    margin: 1.75rem 0 0;
    max-width: 30rem;
    color: var(--ink-soft);
    text-wrap: pretty;
  }

  .rule {
    width: 3rem;
    height: 1px;
    margin: 2.5rem 0;
    border: 0;
    background: var(--rule);
  }

  .contact {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 0.9375rem;
  }

  a {
    color: inherit;
    text-decoration-color: var(--rule);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.25em;
    transition: color 120ms ease, text-decoration-color 120ms ease;
  }

  a:hover, a:focus-visible {
    color: var(--accent);
    text-decoration-color: currentColor;
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  footer {
    max-width: 34rem;
    margin: 0 auto;
    padding-top: 2rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 0.8125rem;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<main>
  <!-- ==== EDIT THE COPY BELOW ==== -->
  <p class="eyebrow">Wrede Global</p>

  <h1>
    Something
    <span class="of">is being built.</span>
  </h1>

  <p class="lede">
    A fuller site is on the way. Until then, the door is open —
    write and we will answer.
  </p>

  <hr class="rule">

  <p class="contact">
    <a href="mailto:hello@wredeglobal.com">hello@wredeglobal.com</a>
  </p>
  <!-- ============================= -->
</main>

<footer>
  <p>&copy; <span id="year">2026</span> Wrede Global</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
