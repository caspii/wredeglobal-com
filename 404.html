<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Wrede Global</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#16150f; --ink-soft:#5c584b; --paper:#faf8f3; --accent:#9a4b1e; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2efe6; --ink-soft:#a29d90; --paper:#14130f; --accent:#d9a15e; }
  }
  body {
    margin:0; min-height:100svh; display:grid; place-content:center;
    padding:2rem 1.5rem; text-align:center;
    background:var(--paper); color:var(--ink);
    font-family: ui-serif, Iowan Old Style, Palatino, Georgia, serif;
    line-height:1.6;
  }
  h1 { margin:0 0 0.75rem; font-size:clamp(2rem,5vw,3rem); font-weight:500; letter-spacing:-0.02em; }
  p  { margin:0 0 2rem; color:var(--ink-soft); }
  a  { color:var(--accent); text-underline-offset:0.25em; }
</style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>That page does not exist.</p>
    <a href="/">Back to the front page</a>
  </div>
</body>
</html>
